<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-POP Vocab Wiki</title>
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; color: #333; line-height: 1.6; padding-bottom: 40px; }
    header { background: linear-gradient(135deg, #ff007f, #7f00ff); color: white; text-align: center; padding: 2rem 1rem; }
    header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    
    /* タブ切り替えバー */
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { padding: 8px 14px; border: none; background: #e0e0e0; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; white-space: nowrap; }
    .tab-btn.active { background: #ff007f; color: white; }
    
    /* 単語カード */
    .word-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; }
    .word-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .word-title-group { display: flex; align-items: center; gap: 8px; }
    .word-title { font-size: 1.5rem; color: #ff007f; font-weight: bold; }
    .lang-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .lang-badge.en { background: #e3f2fd; color: #1976d2; }
    .lang-badge.ko { background: #fbe9e7; color: #d84315; }
    
    .card-actions { display: flex; gap: 10px; align-items: center; }
    .bookmark-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #ccc; }
    .bookmark-btn.active { color: #ffb700; }
    .delete-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #999; }
    .meaning { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; color: #444; }
    .lyric-box { background: #f9f9f9; border-left: 4px solid #7f00ff; padding: 10px 15px; border-radius: 4px; font-style: italic; margin-bottom: 8px; }
    .song-info { font-size: 0.85rem; color: #666; text-align: right; }
    
    /* 登録フォーム */
    .form-section { background: white; border-radius: 12px; padding: 20px; margin-top: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .form-section h2 { font-size: 1.2rem; margin-bottom: 15px; color: #333; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    .submit-btn { background: #7f00ff; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>🎵 K-POP Vocab Wiki</h1>
    <p>K-POPフレーズで覚える 英語＆韓国語</p>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="単語・曲名・アーティストで検索..." oninput="render()">
    </div>

    <!-- 切り替えタブ -->
    <div class="tabs">
      <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">すべて</button>
      <button class="tab-btn" id="tabEn" onclick="switchTab('en')">🔤 英語</button>
      <button class="tab-btn" id="tabKo" onclick="switchTab('ko')">🇰🇷 韓国語</button>
      <button class="tab-btn" id="tabBookmark" onclick="switchTab('bookmark')">⭐ ブックマーク</button>
    </div>

    <div id="wordList"></div>

    <!-- 登録フォーム -->
    <div class="form-section">
      <h2>＋ 新しい単語を登録する</h2>
      <form id="addWordForm" onsubmit="addWord(event)">
        <div class="form-group">
          <label>言語</label>
          <select id="inputLang">
            <option value="en">英語 (English)</option>
            <option value="ko">韓国語 (한국어)</option>
          </select>
        </div>
        <div class="form-group">
          <label>単語 / フレーズ</label>
          <input type="text" id="inputWord" required placeholder="例: Drama / 영원히 (ヨンウォニ)">
        </div>
        <div class="form-group">
          <label>日本語の意味</label>
          <input type="text" id="inputMeaning" required placeholder="例: 劇、ドラマ / 永遠に">
        </div>
        <div class="form-group">
          <label>歌詞フレーズ</label>
          <input type="text" id="inputLyric" required placeholder="例: Yeah I'm the Drama / 영원히 함께（永遠に一緒に）">
        </div>
        <div class="form-group">
          <label>曲名 & アーティスト名</label>
          <input type="text" id="inputSong" required placeholder="例: Drama - aespa">
        </div>
        <button type="submit" class="submit-btn">単語帳に追加・保存する</button>
      </form>
    </div>
  </div>

  <script>
    const defaultWords = [
      { id: 1, lang: "en", word: "Drama", meaning: "劇、ドラマのような出来事", lyric: "Yeah I'm the Drama", song: "Drama - aespa", bookmarked: false },
      { id: 2, lang: "en", word: "Supernatural", meaning: "超自然的な、不可思議な", lyric: "It's supernatural", song: "Supernatural - NewJeans", bookmarked: true },
      { id: 3, lang: "ko", word: "영원히 (ヨンウォニ)", meaning: "永遠に", lyric: "영원히 함께（永遠に一緒に）", song: "Forever - BABYMONSTER", bookmarked: false },
      { id: 4, lang: "ko", word: "사랑해 (サランヘ)", meaning: "愛してる", lyric: "널 사랑해（君を愛してる）", song: "LOVE DIVE - IVE", bookmarked: false }
    ];

    let words = JSON.parse(localStorage.getItem('kpop_vocab_data')) || defaultWords;
    let currentFilter = 'all';

    function saveData() {
      localStorage.setItem('kpop_vocab_data', JSON.stringify(words));
    }

    function render() {
      const listEl = document.getElementById('wordList');
      const searchTxt = document.getElementById('searchInput').value.toLowerCase();
      listEl.innerHTML = '';

      const filtered = words.filter(w => {
        const matchesSearch = w.word.toLowerCase().includes(searchTxt) || 
                              w.meaning.includes(searchTxt) || 
                              w.song.toLowerCase().includes(searchTxt);
        
        let matchesTab = false;
        if (currentFilter === 'all') matchesTab = true;
        else if (currentFilter === 'en') matchesTab = (w.lang === 'en');
        else if (currentFilter === 'ko') matchesTab = (w.lang === 'ko');
        else if (currentFilter === 'bookmark') matchesTab = w.bookmarked;

        return matchesSearch && matchesTab;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">該当する単語が見つかりません。</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'word-card';
        const langText = item.lang === 'ko' ? '韓国語' : '英語';
        const langClass = item.lang === 'ko' ? 'ko' : 'en';

        card.innerHTML = `
          <div class="word-header">
            <div class="word-title-group">
              <span class="word-title">${item.word}</span>
              <span class="lang-badge ${langClass}">${langText}</span>
            </div>
            <div class="card-actions">
              <button class="bookmark-btn ${item.bookmarked ? 'active' : ''}" onclick="toggleBookmark(${item.id})">★</button>
              <button class="delete-btn" onclick="deleteWord(${item.id})" title="削除">🗑️</button>
            </div>
          </div>
          <div class="meaning">意味: ${item.meaning}</div>
          <div class="lyric-box">"${item.lyric}"</div>
          <div class="song-info">🎵 ${item.song}</div>
        `;
        listEl.appendChild(card);
      });
    }

    function toggleBookmark(id) {
      const target = words.find(w => w.id === id);
      if (target) {
        target.bookmarked = !target.bookmarked;
        saveData();
        render();
      }
    }

    function deleteWord(id) {
      if (confirm('この単語を削除しますか？')) {
        words = words.filter(w => w.id !== id);
        saveData();
        render();
      }
    }

    function switchTab(type) {
      currentFilter = type;
      document.getElementById('tabAll').classList.toggle('active', type === 'all');
      document.getElementById('tabEn').classList.toggle('active', type === 'en');
      document.getElementById('tabKo').classList.toggle('active', type === 'ko');
      document.getElementById('tabBookmark').classList.toggle('active', type === 'bookmark');
      render();
    }

    function addWord(e) {
      e.preventDefault();
      const newWord = {
        id: Date.now(),
        lang: document.getElementById('inputLang').value,
        word: document.getElementById('inputWord').value,
        meaning: document.getElementById('inputMeaning').value,
        lyric: document.getElementById('inputLyric').value,
        song: document.getElementById('inputSong').value,
        bookmarked: false
      };
      words.unshift(newWord);
      saveData();
      document.getElementById('addWordForm').reset();
      render();
      alert('保存しました！');
    }

    render();
  </script>
</body>
</html>
