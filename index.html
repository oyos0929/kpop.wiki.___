<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-POP English Vocab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; color: #333; line-height: 1.6; padding-bottom: 40px; }
    header { background: linear-gradient(135deg, #ff007f, #7f00ff); color: white; text-align: center; padding: 2rem 1rem; }
    header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 8px 16px; border: none; background: #e0e0e0; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #ff007f; color: white; }
    .word-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .word-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .word-title { font-size: 1.5rem; color: #ff007f; font-weight: bold; }
    .bookmark-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #ccc; }
    .bookmark-btn.active { color: #ffb700; }
    .meaning { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; color: #444; }
    .lyric-box { background: #f9f9f9; border-left: 4px solid #7f00ff; padding: 10px 15px; border-radius: 4px; font-style: italic; margin-bottom: 8px; }
    .song-info { font-size: 0.85rem; color: #666; text-align: right; }
    .form-section { background: white; border-radius: 12px; padding: 20px; margin-top: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .form-section h2 { font-size: 1.2rem; margin-bottom: 15px; color: #333; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .submit-btn { background: #7f00ff; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>🎵 K-POP English Vocab</h1>
    <p>K-POPのフレーズで覚える英単語 Wiki</p>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="英単語・曲名・アーティスト名で検索..." oninput="render()">
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">すべて表示</button>
      <button class="tab-btn" id="tabBookmark" onclick="switchTab('bookmark')">⭐ ブックマークのみ</button>
    </div>

    <div id="wordList"></div>

    <div class="form-section">
      <h2>＋ 新しい単語を登録する (Wiki風投稿)</h2>
      <form id="addWordForm" onsubmit="addWord(event)">
        <div class="form-group">
          <label>英単語</label>
          <input type="text" id="inputWord" required placeholder="例: Unforgiven">
        </div>
        <div class="form-group">
          <label>日本語の意味</label>
          <input type="text" id="inputMeaning" required placeholder="例: 許されざる者">
        </div>
        <div class="form-group">
          <label>歌詞フレーズ (英語)</label>
          <input type="text" id="inputLyric" required placeholder="例: Unforgiven, I’m a villain">
        </div>
        <div class="form-group">
          <label>曲名 & アーティスト名</label>
          <input type="text" id="inputSong" required placeholder="例: UNFORGIVEN - LE SSERAFIM">
        </div>
        <button type="submit" class="submit-btn">みんなの辞書に追加する</button>
      </form>
    </div>
  </div>

  <script>
    let words = [
      { id: 1, word: "Drama", meaning: "劇、ドラマのような出来事", lyric: "Yeah I'm the Drama", song: "Drama - aespa", bookmarked: false },
      { id: 2, word: "Supernatural", meaning: "超自然的な、不可思議な", lyric: "It's supernatural", song: "Supernatural - NewJeans", bookmarked: true },
      { id: 3, word: "Savage", meaning: "残忍な、容赦ない、めちゃくちゃかっこいい", lyric: "Oh my gosh! Don't you know I'm a Savage?", song: "Savage - aespa", bookmarked: false }
    ];

    let currentFilter = 'all';

    function render() {
      const listEl = document.getElementById('wordList');
      const searchTxt = document.getElementById('searchInput').value.toLowerCase();
      listEl.innerHTML = '';

      const filtered = words.filter(w => {
        const matchesSearch = w.word.toLowerCase().includes(searchTxt) || 
                              w.meaning.includes(searchTxt) || 
                              w.song.toLowerCase().includes(searchTxt);
        const matchesTab = currentFilter === 'all' || (currentFilter === 'bookmark' && w.bookmarked);
        return matchesSearch && matchesTab;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">該当する単語が見つかりません。</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'word-card';
        card.innerHTML = `
          <div class="word-header">
            <span class="word-title">${item.word}</span>
            <button class="bookmark-btn ${item.bookmarked ? 'active' : ''}" onclick="toggleBookmark(${item.id})">★</button>
          </div>
          <div class="meaning">意味: ${item.meaning}</div>
          <div class="lyric-box">"${item.lyric}"</div>
          <div class="song-info">🎵 ${item.song}</div>
        `;
        listEl.appendChild(card);
      });
    }

    function toggleBookmark(id) {
      const target = words.find(w => w.id === id);
      if (target) {
        target.bookmarked = !target.bookmarked;
        render();
      }
    }

    function switchTab(type) {
      currentFilter = type;
      document.getElementById('tabAll').classList.toggle('active', type === 'all');
      document.getElementById('tabBookmark').classList.toggle('active', type === 'bookmark');
      render();
    }

    function addWord(e) {
      e.preventDefault();
      const newWord = {
        id: Date.now(),
        word: document.getElementById('inputWord').value,
        meaning: document.getElementById('inputMeaning').value,
        lyric: document.getElementById('inputLyric').value,
        song: document.getElementById('inputSong').value,
        bookmarked: false
      };
      words.unshift(newWord);
      document.getElementById('addWordForm').reset();
      render();
      alert('単語を追加しました！');
    }

    render();
  </script>
</body>
</html>
